<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Career timeline: Mitratech 2013-2017 team lead and software engineer; Omnisport 2017-2019 team lead and QA lead; Telus International 2019-2020 full stack developer; The UPS Store 2020-now general manager; independent developer 2023-now">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F1B2D"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2F81F7" stop-opacity="0.3"/><stop offset="1" stop-color="#00C9A7"/></linearGradient>
  </defs>
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .y{font-size:12.5px;fill:#7D8FA6}
    .r{font-size:15.5px;font-weight:700;fill:#E6EDF3}
    .c{font-size:15.5px;font-weight:600;fill:#58A6FF}
    .d{font-size:13px;fill:#9FB0C3}
  </style>
  <rect x="0.5" y="0.5" width="839" height="399" rx="16" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="150" y="38" width="2" height="326" fill="url(#rail)"/>

  <g class="s">
    <g transform="translate(0 40)">
      <text x="128" y="5" text-anchor="end" class="m y">2023 – now</text>
      <circle cx="151" cy="0" r="7" fill="#00C9A7"><animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="151" cy="0" r="4" fill="#0B1220"/>
      <text x="176" y="5"><tspan class="r">Independent Developer</tspan><tspan class="c" dx="8">Freelance &amp; clients</tspan></text>
      <text x="176" y="27" class="d">Paid client systems and freelance projects under NDA; CompletePoolApp for a real client.</text>
    </g>
    <g transform="translate(0 112)">
      <text x="128" y="5" text-anchor="end" class="m y">2020 – now</text>
      <circle cx="151" cy="0" r="6" fill="#2F81F7"/>
      <text x="176" y="5"><tspan class="r">General Manager</tspan><tspan class="c" dx="8">The UPS Store, Brickell</tspan></text>
      <text x="176" y="27" class="d">Runs a team of 7-10. Built an internal operations portal for the store.</text>
    </g>
    <g transform="translate(0 184)">
      <text x="128" y="5" text-anchor="end" class="m y">2019 – 2020</text>
      <circle cx="151" cy="0" r="6" fill="#2F81F7"/>
      <text x="176" y="5"><tspan class="r">Full Stack Developer</tspan><tspan class="c" dx="8">Telus International</tspan></text>
      <text x="176" y="27" class="d">Built an API-management app end to end (React, Node.js, Cassandra); Jenkins/OpenShift CI/CD.</text>
    </g>
    <g transform="translate(0 256)">
      <text x="128" y="5" text-anchor="end" class="m y">2017 – 2019</text>
      <circle cx="151" cy="0" r="6" fill="#2F81F7"/>
      <text x="176" y="5"><tspan class="r">Team Lead &amp; QA Lead</tspan><tspan class="c" dx="8">Omnisport</tspan></text>
      <text x="176" y="27" class="d">Led 5 devs + 3 testers on retail systems; unblocked ~50 projects stuck in testing.</text>
    </g>
    <g transform="translate(0 328)">
      <text x="128" y="5" text-anchor="end" class="m y">2013 – 2017</text>
      <circle cx="151" cy="0" r="6" fill="#2F81F7"/>
      <text x="176" y="5"><tspan class="r">Team Lead &amp; Software Engineer</tspan><tspan class="c" dx="8">Mitratech</tspan></text>
      <text x="176" y="27" class="d">Legal-tech products; led up to 12 people and coded HotDocs' move to cross-browser.</text>
    </g>
  </g>
</svg>
