<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="Ecommerce: online store with web shop, back office and mobile app on one API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#16193A"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A371F7"/><stop offset="1" stop-color="#2F81F7"/></linearGradient>
    <clipPath id="c"><rect width="840" height="210" rx="16"/></clipPath>
  </defs>
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .t{font-size:24px;font-weight:800;fill:#E6EDF3}
    .d{font-size:14px;fill:#A9BCD0}
    .n{font-size:24px;font-weight:800;fill:#B392F0}
    .k{font-size:12px;fill:#8B9BB0}
    .chip{font-size:11.5px;font-weight:600;fill:#C9D1D9}
    .tag{font-size:11px;font-weight:700;fill:#FFFFFF}
    .node{font-size:11px;font-weight:700;fill:#E6EDF3}
  </style>
  <g clip-path="url(#c)">
    <rect width="840" height="210" fill="url(#bg)"/>
    <rect width="5" height="210" fill="url(#bar)"/>
    <circle cx="790" cy="20" r="120" fill="#A371F7" opacity="0.07"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="209" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="32" y="48" class="s t">Ecommerce</text>
  <rect x="186" y="30" width="122" height="22" rx="11" fill="#6E40C9"/><text x="247" y="45" text-anchor="middle" class="s tag">SECURITY FIRST</text>

  <text x="32" y="78" class="s d">General-purpose store: variants, timed stock holds, Stripe + cash on delivery,</text>
  <text x="32" y="98" class="s d">returns and refunds. Built so it can't oversell and can't double-charge.</text>

  <g class="s">
    <text x="32" y="142" class="n">3→1</text><text x="32" y="160" class="k">clients on one API</text>
    <text x="172" y="142" class="n">0</text><text x="172" y="160" class="k">oversells: row locks</text>
    <text x="312" y="142" class="n">1×</text><text x="312" y="160" class="k">order per click: idempotency</text>
    <text x="492" y="142" class="n">3</text><text x="492" y="160" class="k">test suites</text>
  </g>

  <g class="s" transform="translate(32 178)">
    <rect width="66" height="20" rx="10" fill="#211F44"/><text x="33" y="14" text-anchor="middle" class="chip">React 18</text>
    <rect x="72" width="106" height="20" rx="10" fill="#211F44"/><text x="125" y="14" text-anchor="middle" class="chip">React Native</text>
    <rect x="184" width="96" height="20" rx="10" fill="#211F44"/><text x="232" y="14" text-anchor="middle" class="chip">Node/Express</text>
    <rect x="286" width="86" height="20" rx="10" fill="#211F44"/><text x="329" y="14" text-anchor="middle" class="chip">PostgreSQL</text>
    <rect x="378" width="54" height="20" rx="10" fill="#211F44"/><text x="405" y="14" text-anchor="middle" class="chip">Redis</text>
    <rect x="438" width="58" height="20" rx="10" fill="#211F44"/><text x="467" y="14" text-anchor="middle" class="chip">Stripe</text>
    <rect x="502" width="62" height="20" rx="10" fill="#211F44"/><text x="533" y="14" text-anchor="middle" class="chip">Docker</text>
  </g>

  <!-- architecture motif: 3 clients -> API -> DB -->
  <g transform="translate(626 40)" class="s">
    <g fill="#1C1F45" stroke="#A371F7" stroke-opacity="0.55">
      <rect x="0" y="0" width="64" height="26" rx="6"/>
      <rect x="0" y="44" width="64" height="26" rx="6"/>
      <rect x="0" y="88" width="64" height="26" rx="6"/>
    </g>
    <text x="32" y="17" text-anchor="middle" class="node">Shop</text>
    <text x="32" y="61" text-anchor="middle" class="node">Admin</text>
    <text x="32" y="105" text-anchor="middle" class="node">Mobile</text>
    <g stroke="#A371F7" stroke-opacity="0.6" stroke-width="1.5" fill="none" stroke-dasharray="4 4">
      <path d="M64 13 C 96 13, 96 57, 112 57"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></path>
      <path d="M64 57 L112 57"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></path>
      <path d="M64 101 C 96 101, 96 57, 112 57"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></path>
      <path d="M156 57 L170 57"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/></path>
    </g>
    <rect x="112" y="40" width="44" height="34" rx="7" fill="#2F81F7"/>
    <text x="134" y="61" text-anchor="middle" class="node">API</text>
    <ellipse cx="190" cy="44" rx="18" ry="6" fill="#336791"/>
    <rect x="172" y="44" width="36" height="28" fill="#336791"/>
    <ellipse cx="190" cy="72" rx="18" ry="6" fill="#2A5578"/>
    <ellipse cx="190" cy="44" rx="18" ry="6" fill="#4A82B0"/>
    <text x="190" y="64" text-anchor="middle" class="node" font-size="9">PG</text>
  </g>
</svg>
