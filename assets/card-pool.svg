<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-label="CompletePoolApp: management system for a real pool service company, web and mobile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0E2233"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00C9A7"/><stop offset="1" stop-color="#2F81F7"/></linearGradient>
    <clipPath id="c"><rect width="840" height="210" rx="16"/></clipPath>
  </defs>
  <style>
    .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .t{font-size:24px;font-weight:800;fill:#E6EDF3}
    .d{font-size:14px;fill:#A9BCD0}
    .n{font-size:24px;font-weight:800;fill:#00C9A7}
    .k{font-size:12px;fill:#8B9BB0}
    .chip{font-size:11.5px;font-weight:600;fill:#C9D1D9}
    .tag{font-size:11px;font-weight:700;fill:#0B1220}
  </style>
  <g clip-path="url(#c)">
    <rect width="840" height="210" fill="url(#bg)"/>
    <rect width="5" height="210" fill="url(#bar)"/>
    <circle cx="790" cy="20" r="120" fill="#00C9A7" opacity="0.06"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="209" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <text x="32" y="48" class="s t">CompletePoolApp</text>
  <rect x="262" y="30" width="74" height="22" rx="11" fill="#00C9A7"/><text x="299" y="45" text-anchor="middle" class="s tag">LIVE DEMO</text>
  <rect x="344" y="30" width="96" height="22" rx="11" fill="#2F81F7"/><text x="392" y="45" text-anchor="middle" class="s tag" fill="#FFFFFF" style="fill:#fff">REAL CLIENT</text>

  <text x="32" y="78" class="s d">Runs a pool service company: scheduling, routes, approvals, invoices and payments.</text>
  <text x="32" y="98" class="s d">Office web app + field-worker mobile app on one shared data layer.</text>

  <g class="s">
    <text x="32" y="142" class="n">27</text><text x="32" y="160" class="k">Prisma models</text>
    <text x="162" y="142" class="n">3</text><text x="162" y="160" class="k">roles, RBAC + RLS</text>
    <text x="292" y="142" class="n">2</text><text x="292" y="160" class="k">clients: web + mobile</text>
    <text x="442" y="142" class="n">QR</text><text x="442" y="160" class="k">invoices, Stripe pay</text>
  </g>

  <g class="s" transform="translate(32 178)">
    <rect width="72" height="20" rx="10" fill="#1A2A40"/><text x="36" y="14" text-anchor="middle" class="chip">Next.js 14</text>
    <rect x="78" width="80" height="20" rx="10" fill="#1A2A40"/><text x="118" y="14" text-anchor="middle" class="chip">TypeScript</text>
    <rect x="164" width="80" height="20" rx="10" fill="#1A2A40"/><text x="204" y="14" text-anchor="middle" class="chip">Expo / RN</text>
    <rect x="250" width="60" height="20" rx="10" fill="#1A2A40"/><text x="280" y="14" text-anchor="middle" class="chip">Prisma</text>
    <rect x="316" width="76" height="20" rx="10" fill="#1A2A40"/><text x="354" y="14" text-anchor="middle" class="chip">Supabase</text>
    <rect x="398" width="60" height="20" rx="10" fill="#1A2A40"/><text x="428" y="14" text-anchor="middle" class="chip">Stripe</text>
    <rect x="464" width="48" height="20" rx="10" fill="#1A2A40"/><text x="488" y="14" text-anchor="middle" class="chip">Jest</text>
  </g>

  <!-- phone + browser motif -->
  <g transform="translate(626 46)" opacity="0.95">
    <rect width="150" height="104" rx="8" fill="#0D1626" stroke="#2F81F7" stroke-opacity="0.5"/>
    <rect width="150" height="16" rx="8" fill="#13233A"/><rect y="8" width="150" height="8" fill="#13233A"/>
    <rect x="10" y="26" width="58" height="8" rx="3" fill="#00C9A7" opacity="0.8"/>
    <rect x="10" y="42" width="130" height="6" rx="3" fill="#24364F"/>
    <rect x="10" y="54" width="110" height="6" rx="3" fill="#24364F"/>
    <rect x="10" y="70" width="38" height="24" rx="4" fill="#1B3A4E"/>
    <rect x="54" y="70" width="38" height="24" rx="4" fill="#1B3A4E"/>
    <rect x="98" y="70" width="42" height="24" rx="4" fill="#00C9A7" opacity="0.35"/>
    <rect x="120" y="44" width="56" height="96" rx="10" fill="#0B1220" stroke="#00C9A7" stroke-opacity="0.7"/>
    <rect x="128" y="58" width="40" height="6" rx="3" fill="#2F81F7" opacity="0.8"/>
    <rect x="128" y="72" width="40" height="18" rx="4" fill="#1B3A4E"/>
    <rect x="128" y="96" width="40" height="18" rx="4" fill="#1B3A4E"/>
    <circle cx="148" cy="128" r="5" fill="#00C9A7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
