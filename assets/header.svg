<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" role="img" aria-label="Saul Hernandez, Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10213A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="0.5" stop-color="#00C9A7"/>
      <stop offset="1" stop-color="#2F81F7"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#00C9A7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00C9A7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="840" height="280" rx="18"/></clipPath>
    <clipPath id="l1"><rect x="40" y="168" height="24" width="0"><animate attributeName="width" from="0" to="480" dur="1.1s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="196" height="24" width="0"><animate attributeName="width" from="0" to="480" dur="1.1s" begin="1.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="224" height="24" width="0"><animate attributeName="width" from="0" to="480" dur="1.1s" begin="2.7s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .name{font-size:46px;font-weight:800;fill:#E6EDF3;letter-spacing:-0.5px}
    .role{font-size:24px;font-weight:700}
    .line{font-size:14.5px;fill:#A9BCD0}
    .p{fill:#00C9A7}
    .pill{font-size:12px;font-weight:600;fill:#7EE2B8}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="280" fill="url(#bg)"/>
    <rect width="840" height="280" fill="url(#grid)"/>
    <rect width="840" height="280" fill="url(#glow)"/>
    <rect y="0" width="840" height="3" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="839" height="279" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- status pill -->
  <rect x="40" y="34" width="132" height="26" rx="13" fill="#0E2A22" stroke="#2EA043" stroke-opacity="0.6"/>
  <circle cx="57" cy="47" r="4" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="51.5" class="sans pill">Open to work</text>

  <text x="40" y="112" class="sans name">Saul Hernandez</text>
  <text x="42" y="146" class="sans role" fill="url(#accent)">Full Stack Developer</text>

  <g class="mono line">
    <text x="40" y="186" clip-path="url(#l1)"><tspan class="p">❯</tspan> React · Node.js · TypeScript · Java · 7+ years</text>
    <text x="40" y="214" clip-path="url(#l2)"><tspan class="p">❯</tspan> building web + mobile apps real businesses run on</text>
    <text x="40" y="242" clip-path="url(#l3)"><tspan class="p">❯</tspan> ex team lead &amp; QA lead · bilingual ES/EN</text>
  </g>
  <rect x="40" y="250" width="9" height="3" fill="#00C9A7" class="cur" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.01s" fill="freeze"/>
  </rect>

  <!-- code window -->
  <g transform="translate(588 60)">
    <rect width="214" height="168" rx="12" fill="#0D1626" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect width="214" height="28" rx="12" fill="#121F33"/>
    <rect y="16" width="214" height="12" fill="#121F33"/>
    <circle cx="16" cy="14" r="4.5" fill="#FF5F57"/>
    <circle cx="31" cy="14" r="4.5" fill="#FEBC2E"/>
    <circle cx="46" cy="14" r="4.5" fill="#28C840"/>
    <text x="196" y="18" text-anchor="end" class="mono" font-size="10" fill="#6E7F96">order.service.ts</text>
    <g class="mono" font-size="10.5">
      <text x="14" y="50"><tspan fill="#FF7B72">await</tspan><tspan fill="#C9D1D9"> db.</tspan><tspan fill="#D2A8FF">$transaction</tspan><tspan fill="#C9D1D9">(</tspan></text>
      <text x="26" y="68"><tspan fill="#FF7B72">async</tspan><tspan fill="#C9D1D9"> (tx) =&gt; {</tspan></text>
      <text x="38" y="86"><tspan fill="#D2A8FF">lockStock</tspan><tspan fill="#C9D1D9">(tx, sku)</tspan></text>
      <text x="38" y="104"><tspan fill="#D2A8FF">assertIdempotent</tspan><tspan fill="#C9D1D9">(key)</tspan></text>
      <text x="38" y="122"><tspan fill="#FF7B72">return</tspan><tspan fill="#C9D1D9"> </tspan><tspan fill="#D2A8FF">createOrder</tspan><tspan fill="#C9D1D9">()</tspan></text>
      <text x="26" y="140" fill="#C9D1D9">})</text>
    </g>
    <rect x="14" y="150" width="60" height="4" rx="2" fill="#2EA043" opacity="0.8">
      <animate attributeName="width" values="20;186;186" keyTimes="0;0.6;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
